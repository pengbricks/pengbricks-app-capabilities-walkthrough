bundle:
  name: capability-guides-ml-lifecycle

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schema, tables, and registered models
  warehouse_id:
    description: SQL warehouse that evaluates the drift alert
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  notification_email:
    description: Address that receives failure and drift alerts
  schema:
    description: Schema for source data, feature tables, models, and monitoring tables
    default: capability_guides
  use_case:
    description: Use-case spec under use_cases/ that drives data, features, models, and thresholds
    default: general
  release:
    description: Release identifier (CI sets the Git commit SHA) recorded on experiment runs
    default: local
  gpu_accelerator:
    description: Accelerator for the AI Runtime single-GPU task (GPU_1xA10, GPU_1xH100, or GPU_8xH100)
    default: GPU_1xA10
  distributed_accelerator:
    description: Accelerator for the AI Runtime distributed task. Keep GPU_1xA10 for the default one-GPU run; GPU_8xH100 for the multi-GPU run
    default: GPU_1xA10

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
    variables:
      schema: dev_${workspace.current_user.short_name}_capability_guides
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
