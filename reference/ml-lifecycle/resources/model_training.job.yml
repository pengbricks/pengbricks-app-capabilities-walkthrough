# Trains a scikit-learn model with MLflow, and brings a pickled model into Unity Catalog as a pyfunc while reproducing its recorded baseline.
resources:
  jobs:
    capability_guides_model_training:
      name: capability-guides-model-training
      description: Trains a scikit-learn model with MLflow, and brings a pickled model into Unity Catalog as a pyfunc while reproducing its recorded baseline.
      tags:
        capability_guide_job: capability_guides_model_training
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: release
          default: ${var.release}
        - name: experiment
          default: ${resources.experiments.ml_lifecycle_experiment.name}
        - name: volume
          default: ${resources.volumes.legacy_models.name}
      tasks:
        - task_key: export_legacy_model
          notebook_task:
            notebook_path: ../guides/model-training-compatibility/01_export_legacy_model.py

        - task_key: train_native
          depends_on:
            - task_key: export_legacy_model
          notebook_task:
            notebook_path: ../guides/model-training-compatibility/02_train_native.py

        - task_key: import_legacy_model
          depends_on:
            - task_key: export_legacy_model
          notebook_task:
            notebook_path: ../guides/model-training-compatibility/03_import_legacy_model.py

