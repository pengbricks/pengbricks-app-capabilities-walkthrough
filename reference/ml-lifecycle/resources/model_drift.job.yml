# Scores batches, records operational and model metrics, detects drift across later customer snapshots, and trains a challenger on a breach.
resources:
  jobs:
    capability_guides_model_drift:
      name: capability-guides-model-drift
      description: Scores batches, records operational and model metrics, detects drift across later customer snapshots, and trains a challenger on a breach.
      tags:
        capability_guide_job: capability_guides_model_drift
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: source_volume
          default: ${resources.volumes.ml_source_files.name}
        - name: experiment
          default: ${resources.experiments.ml_lifecycle_experiment.name}
      tasks:
        - task_key: train_baseline
          notebook_task:
            notebook_path: ../guides/model-performance-drift/01_train_baseline.py

        - task_key: score_batches
          depends_on:
            - task_key: train_baseline
          notebook_task:
            notebook_path: ../guides/model-performance-drift/02_score_batches.py

        - task_key: detect_drift
          depends_on:
            - task_key: score_batches
          notebook_task:
            notebook_path: ../guides/model-performance-drift/03_detect_drift.py

        - task_key: breach_check
          depends_on:
            - task_key: detect_drift
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.detect_drift.values.breach}}"
            right: "true"

        - task_key: retrain_candidate
          depends_on:
            - task_key: breach_check
              outcome: "true"
          notebook_task:
            notebook_path: ../guides/model-performance-drift/04_retrain_candidate.py
