# Scores batches, records operational and model metrics, detects a simulated feature shift, and trains a challenger on a breach.
resources:
  jobs:
    capability_guides_model_drift:
      name: capability-guides-model-drift
      description: Scores batches, records operational and model metrics, detects a simulated feature shift, and trains a challenger on a breach.
      tags:
        capability_guide_job: capability_guides_model_drift
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies:
              - mlflow>=3.1
              - scikit-learn>=1.4
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
              - databricks-sdk>=0.70
      tasks:
        - task_key: train_baseline
          environment_key: ml
          spark_python_task:
            python_file: ../src/md_train_baseline.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --spec=${workspace.file_path}/use_cases/${var.use_case}.yml
              - --experiment=${resources.experiments.ml_lifecycle_experiment.name}

        - task_key: score_batches
          depends_on:
            - task_key: train_baseline
          environment_key: ml
          spark_python_task:
            python_file: ../src/md_score_batches.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --spec=${workspace.file_path}/use_cases/${var.use_case}.yml

        - task_key: detect_drift
          depends_on:
            - task_key: score_batches
          environment_key: ml
          spark_python_task:
            python_file: ../src/md_detect_drift.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --spec=${workspace.file_path}/use_cases/${var.use_case}.yml

        - task_key: breach_check
          depends_on:
            - task_key: detect_drift
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.detect_drift.values.breach}}"
            right: "true"

        - task_key: retrain_candidate
          depends_on:
            - task_key: breach_check
              outcome: "true"
          environment_key: ml
          spark_python_task:
            python_file: ../src/md_retrain_candidate.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --spec=${workspace.file_path}/use_cases/${var.use_case}.yml
              - --experiment=${resources.experiments.ml_lifecycle_experiment.name}
              - --first-breach-batch={{tasks.detect_drift.values.first_breach_batch}}
