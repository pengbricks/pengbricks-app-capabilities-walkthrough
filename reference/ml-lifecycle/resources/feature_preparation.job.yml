# Lands the UCI Online Retail II file, builds a customer snapshot, builds a Unity Catalog feature table with quality checks, freezes a versioned training set, and records lineage.
resources:
  jobs:
    capability_guides_feature_preparation:
      name: capability-guides-feature-preparation
      description: Lands the UCI Online Retail II file, builds a customer snapshot, builds a Unity Catalog feature table with quality checks, freezes a versioned training set, and records lineage.
      tags:
        capability_guide_job: capability_guides_feature_preparation
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: source_volume
          default: ${resources.volumes.ml_source_files.name}
      tasks:
        - task_key: land_source
          notebook_task:
            notebook_path: ../guides/data-ingestion-feature-preparation/01_land_source.py

        - task_key: build_features
          depends_on:
            - task_key: land_source
          notebook_task:
            notebook_path: ../guides/data-ingestion-feature-preparation/02_build_features.py

        - task_key: snapshot_training_set
          depends_on:
            - task_key: build_features
          notebook_task:
            notebook_path: ../guides/data-ingestion-feature-preparation/03_snapshot_training_set.py

        - task_key: record_lineage
          depends_on:
            - task_key: snapshot_training_set
          notebook_task:
            notebook_path: ../guides/data-ingestion-feature-preparation/04_record_lineage.py

