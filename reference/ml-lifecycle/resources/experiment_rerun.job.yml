# Logs a run with its data version, code reference, and environment, then reruns from those references and checks the metric.
resources:
  jobs:
    capability_guides_experiment_rerun:
      name: capability-guides-experiment-rerun
      description: Logs a run with its data version, code reference, and environment, then reruns from those references and checks the metric.
      tags:
        capability_guide_job: capability_guides_experiment_rerun
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: release
          default: ${var.release}
        - name: experiment
          default: ${resources.experiments.ml_lifecycle_experiment.name}
      tasks:
        - task_key: tracked_run
          notebook_task:
            notebook_path: ../guides/experiment-tracking/01_tracked_run.py

        - task_key: append_new_data
          depends_on:
            - task_key: tracked_run
          notebook_task:
            notebook_path: ../guides/experiment-tracking/02_append_new_data.py

        - task_key: rerun_and_compare
          depends_on:
            - task_key: append_new_data
          notebook_task:
            notebook_path: ../guides/experiment-tracking/03_rerun_and_compare.py
            base_parameters:
              run_id: "{{tasks.tracked_run.values.run_id}}"

