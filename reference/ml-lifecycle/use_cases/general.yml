# Use-case spec for all four ML guides. Code reads this file; nothing in src/ names a domain.
# Data: UCI Online Retail II (CC BY 4.0), invoice lines from a UK online retailer, Dec 2009 to Dec 2011.
# Chen, D. (2012). Online Retail II [Dataset]. UCI Machine Learning Repository. https://doi.org/10.24432/C5CG6D
name: general
seed: 20261014

source:
  dataset: online_retail_ii                # a key of public_data.SOURCES
  transactions_table: ml_retail_transactions   # invoice lines as downloaded, blank customer IDs included
  table: customer_activity_raw              # one row per customer at snapshot_date, with the label
  key: customer_id
  snapshot_date: "2010-09-01"
  # Columns customer_snapshot_sql returns. days_between_orders is null for single-order customers.
  columns: [tenure_months, monthly_spend, returns, products_per_order, days_since_purchase, days_between_orders]

label:
  name: churned
  window_months: 6                          # churned = no order in the 6 months after the snapshot date

# Guide 1: feature preparation
features:
  table: customer_features
  passthrough: [tenure_months, monthly_spend, returns, products_per_order, days_since_purchase]
  derived:
    - {name: order_gap_days, expr: "coalesce(days_between_orders, days_since_purchase)"}
    - {name: single_order, expr: "CAST(days_between_orders IS NULL AS INT)"}
    - {name: lifetime_spend, expr: "monthly_spend * greatest(tenure_months, 1.0)"}
    - {name: returns_per_year, expr: "returns * 12.0 / greatest(tenure_months, 1.0)"}
    - {name: is_inactive, expr: "CAST(days_since_purchase > 90 AS INT)"}
  ranges:                 # inclusive [min, max] quality checks
    tenure_months: [0, 25]
    monthly_spend: [0, 100000]
    returns: [0, 500]
    products_per_order: [0, 1000]
    days_since_purchase: [0, 750]
    order_gap_days: [0, 750]
  training_set_prefix: training_set_v

# Guides 2, 3, 4: models trained on the snapshot columns
model:
  features: [tenure_months, monthly_spend, returns, products_per_order, days_since_purchase, order_gap_days]
  derived: {order_gap_days: "coalesce(days_between_orders, days_since_purchase)"}
  holdout_mod: 5
  trained_name: churn_classifier
  imported_name: churn_classifier_imported
  drift_name: churn_drift_model
  baseline_tolerance: 0.001   # imported model AUC vs recorded baseline
  rerun_tolerance: 0.001      # rerun AUC vs tracked run AUC

# Guide 3: the new data that arrives after the tracked run
experiment:
  append_snapshot_date: "2010-12-01"   # customers whose first order falls before this date join the table

# Guide 4: drift. Each batch is the customer base at a later snapshot date, scored by the baseline model.
drift:
  batch_dates: ["2010-10-01", "2010-11-01", "2010-12-01", "2011-01-01", "2011-02-01",
                "2011-03-01", "2011-04-01", "2011-05-01", "2011-06-01"]
  psi_threshold: 0.2
  mean_shift_threshold: 0.5   # in baseline standard deviations
