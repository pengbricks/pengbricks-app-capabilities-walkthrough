bundle:
  name: capability-guides-geospatial

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schema
  warehouse_id:
    description: SQL warehouse that backs the dashboard
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  schema:
    description: Schema for this bundle's tables and the geo_files volume
    default: capability_guides
  radius_m:
    description: Distance in meters around a main break that counts as impacted
    default: "260"
  release:
    description: Release identifier recorded in resource tags
    default: local

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
    variables:
      schema: dev_${workspace.current_user.short_name}_capability_guides
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
