resources:
  jobs:
    # Steady state after the demo: ingest, then silver. Ships paused; unpause after the first good run.
    capability_guides_lakeflow_connect_schedule:
      name: capability-guides-lfc-sqlserver-schedule
      tags:
        capability_guide_job: capability_guides_lakeflow_connect_schedule
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 */30 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.lfc_ingestion.id}
        - task_key: silver
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.lfc_silver.id}
