# Governed MCP tool call, supervisor handoff, and a two-model gateway comparison with limits and audit.
resources:
  jobs:
    capability_guides_agent_gateway:
      name: capability-guides-agent-gateway
      description: Calls a Unity Catalog function as an MCP tool, hands off between two agents, routes one prompt through two Unity Gateway model services, and records the audit trail and a capability table.
      tags:
        capability_guide_job: capability_guides_agent_gateway
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: prepare_tool
          notebook_task:
            notebook_path: ../guides/agent-framework-support/01_prepare_tool.py

        - task_key: mcp_tool_call
          depends_on:
            - task_key: prepare_tool
          notebook_task:
            notebook_path: ../guides/agent-framework-support/02_mcp_tool_call.py

        - task_key: agent_handoff
          depends_on:
            - task_key: mcp_tool_call
          notebook_task:
            notebook_path: ../guides/agent-framework-support/03_agent_handoff.py

        - task_key: gateway_routing
          depends_on:
            - task_key: prepare_tool
          notebook_task:
            notebook_path: ../guides/agent-framework-support/04_gateway_routing.py

        - task_key: gateway_audit
          depends_on:
            - task_key: gateway_routing
          notebook_task:
            notebook_path: ../guides/agent-framework-support/05_gateway_audit.py

        - task_key: capability_matrix
          depends_on:
            - task_key: agent_handoff
            - task_key: gateway_audit
          notebook_task:
            notebook_path: ../guides/agent-framework-support/06_capability_matrix.py
