# Build a tool-calling agent, register a version in Unity Catalog, deploy it to Model Serving, and call it.
resources:
  jobs:
    capability_guides_agent_build:
      name: capability-guides-agent-build
      description: Logs a ResponsesAgent from code, registers a version in Unity Catalog, deploys it to a small scale-to-zero Model Serving endpoint, calls it, and records traces and a build record.
      tags:
        capability_guide_job: capability_guides_agent_build
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 5400
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: release
          default: ${var.release}
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: experiment
          default: ${resources.experiments.agent_build_experiment.name}
        - name: experiment_id
          default: "${resources.experiments.agent_build_experiment.id}"
      tasks:
        - task_key: prepare_tool
          notebook_task:
            notebook_path: ../guides/agent-build-deployment/01_prepare_tool.py

        - task_key: log_and_register
          depends_on:
            - task_key: prepare_tool
          notebook_task:
            notebook_path: ../guides/agent-build-deployment/02_log_and_register.py

        - task_key: deploy_endpoint
          depends_on:
            - task_key: log_and_register
          notebook_task:
            notebook_path: ../guides/agent-build-deployment/03_deploy_endpoint.py
            base_parameters:
              version: "{{tasks.log_and_register.values.version}}"

        - task_key: call_and_record
          depends_on:
            - task_key: deploy_endpoint
          notebook_task:
            notebook_path: ../guides/agent-build-deployment/04_call_and_record.py
            base_parameters:
              endpoint: "{{tasks.deploy_endpoint.values.endpoint}}"
              version: "{{tasks.log_and_register.values.version}}"
              model_run_id: "{{tasks.log_and_register.values.run_id}}"
              ready_seconds: "{{tasks.deploy_endpoint.values.ready_seconds}}"
