bundle:
  name: capability-guides-agents

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schema, tool, and registered agent
  warehouse_id:
    description: SQL warehouse for SQL tasks
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  notification_email:
    description: Address that receives failure alerts
  schema:
    description: Schema for the sample data, tool, agent model, and records
    default: capability_guides_agents
  use_case:
    description: Use-case spec under use_cases/ that drives data, the tool, agents, and gateway services
    default: general
  release:
    description: Release identifier recorded on the model version and in the build record
    default: local

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
