# A SQL alert on the results table's failure view. It ships paused so a deploy never sends mail;
# unpause it and set the schedule when you adopt the pattern.
resources:
  alerts:
    capability_guides_data_validation_alert:
      display_name: "capability-guides-data-validation: error checks failing"
      query_text: >-
        SELECT count(*) AS failing_error_checks
        FROM ${var.catalog}.${var.schema}.dv_latest_failures
        WHERE severity = 'error'
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: failing_error_checks
          display: failing_error_checks
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: PAUSED
        quartz_cron_schedule: "0 0 7 * * ?"
        timezone_id: UTC
