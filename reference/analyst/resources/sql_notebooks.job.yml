# SQL and notebooks at scale: SQL exploration, Python pandas round trip, a 6-million-row aggregation.
# The R notebook ships in guides/sql-notebook-analysis but is not a task, because serverless does not run R.
resources:
  jobs:
    capability_guides_sql_notebooks:
      name: capability-guides-sql-notebooks
      description: Runs SQL exploration, a Python pandas round trip, and a timed aggregation over 6 million generated rows.
      tags:
        capability_guide_job: capability_guides_sql_notebooks
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/sql-notebook-analysis/01_generate_data.py

        - task_key: sql_exploration
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/sql-notebook-analysis/02_sql_exploration.py

        - task_key: python_pandas_roundtrip
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/sql-notebook-analysis/03_python_pandas_roundtrip.py

        - task_key: large_aggregation
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/sql-notebook-analysis/04_large_aggregation.py
            base_parameters:
              run_id: "{{job.run_id}}"
