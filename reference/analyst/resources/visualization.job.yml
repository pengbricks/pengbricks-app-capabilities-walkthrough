# In-platform visualization: two governed views, notebook charts saved to a volume, and a dashboard on the same views.
resources:
  jobs:
    capability_guides_visualization:
      name: capability-guides-visualization
      description: Creates two governed views, draws notebook charts, and confirms the dashboard and chart totals match.
      tags:
        capability_guide_job: capability_guides_visualization
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: analyst
          spec:
            environment_version: "4"
            dependencies:
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
              - matplotlib>=3.8
              - databricks-sdk>=0.70
      tasks:
        - task_key: generate_data
          environment_key: analyst
          spark_python_task:
            python_file: ../src/generate_data.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src=${workspace.file_path}/src
              - --spec=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --tables=analyst_customers,analyst_orders

        - task_key: create_views
          depends_on:
            - task_key: generate_data
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/create_views.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: notebook_charts
          depends_on:
            - task_key: create_views
          environment_key: analyst
          notebook_task:
            notebook_path: ../src/notebooks/charts.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: confirm_totals
          depends_on:
            - task_key: notebook_charts
          environment_key: analyst
          spark_python_task:
            python_file: ../src/confirm_totals.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src=${workspace.file_path}/src
              - --warehouse-id=${var.warehouse_id}
              - --dashboard-id=${resources.dashboards.revenue_overview_dashboard.id}
              - --dashboard-file=${workspace.file_path}/src/dashboards/visualization.lvdash.json
              - --run-id={{job.run_id}}
