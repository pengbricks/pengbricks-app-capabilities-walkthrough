# In-platform visualization: two governed views, notebook charts saved to a volume, and a dashboard on the same views.
resources:
  jobs:
    capability_guides_visualization:
      name: capability-guides-visualization
      description: Creates two governed views, draws notebook charts, and confirms the dashboard and chart totals match.
      tags:
        capability_guide_job: capability_guides_visualization
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: dashboard_id
          default: ${resources.dashboards.revenue_overview_dashboard.id}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/in-platform-visualization/01_generate_data.py

        - task_key: create_views
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/in-platform-visualization/02_create_views.py

        - task_key: notebook_charts
          depends_on:
            - task_key: create_views
          notebook_task:
            notebook_path: ../guides/in-platform-visualization/03_notebook_charts.py

        - task_key: confirm_totals
          depends_on:
            - task_key: notebook_charts
          notebook_task:
            notebook_path: ../guides/in-platform-visualization/04_confirm_totals.py
            base_parameters:
              run_id: "{{job.run_id}}"
