# No-code data preparation: the SQL version of the Lakeflow Designer flow, to compare with the flow's output.
resources:
  jobs:
    capability_guides_no_code_prep:
      name: capability-guides-no-code-prep
      description: Builds prep_flow_output with SQL so the Lakeflow Designer flow has an output to compare against.
      tags:
        capability_guide_job: capability_guides_no_code_prep
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/no-code-data-prep/01_generate_data.py

        - task_key: build_flow_output
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/no-code-data-prep/02_build_flow_output.py
