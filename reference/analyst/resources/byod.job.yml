# Bring your own data: simulate an upload to a per-user volume folder, then join it to a governed table.
resources:
  jobs:
    capability_guides_byod:
      name: capability-guides-byod
      description: Writes a CSV to the caller's upload folder, joins it to analyst_customers, and keeps unmatched keys visible.
      tags:
        capability_guide_job: capability_guides_byod
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/bring-your-own-data/01_generate_data.py

        - task_key: simulate_upload
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/bring-your-own-data/02_simulate_upload.py

        - task_key: join_to_governed
          depends_on:
            - task_key: simulate_upload
          notebook_task:
            notebook_path: ../guides/bring-your-own-data/03_join_to_governed.py
            base_parameters:
              run_id: "{{job.run_id}}"
