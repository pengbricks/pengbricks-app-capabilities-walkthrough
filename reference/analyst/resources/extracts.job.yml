# Self-service extracts: Excel workbook and pipe-delimited file in a volume, plus a scheduled dashboard subscription.
resources:
  jobs:
    capability_guides_extracts:
      name: capability-guides-extracts
      description: Writes a filtered extract as an Excel workbook and a pipe-delimited file, then schedules the dashboard and subscribes the notification address.
      tags:
        capability_guide_job: capability_guides_extracts
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: notification_email
          default: ${var.notification_email}
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: dashboard_id
          default: ${resources.dashboards.partner_orders_dashboard.id}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/self-service-extracts/01_generate_data.py

        - task_key: build_extracts
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/self-service-extracts/02_build_extracts.py
            base_parameters:
              run_id: "{{job.run_id}}"

        - task_key: schedule_dashboard
          depends_on:
            - task_key: build_extracts
          notebook_task:
            notebook_path: ../guides/self-service-extracts/03_schedule_dashboard.py
            base_parameters:
              run_id: "{{job.run_id}}"
