# Train, test, approve, deploy, and record one model release.
resources:
  jobs:
    capability_guides_model_release:
      name: capability-guides-model-release
      description: Trains and registers a model, runs automated tests, promotes @challenger to @champion on approval, deploys to Model Serving, and appends to release history.
      tags:
        capability_guide_job: capability_guides_model_release
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 5400
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: source_volume
          default: ${resources.volumes.release_source_files.name}
        - name: release
          default: ${var.release}
        - name: experiment
          default: ${resources.experiments.model_release_experiment.name}
        - name: min_auc
          default: "${var.min_auc}"
        - name: max_auc_regression
          default: "${var.max_auc_regression}"
        - name: champion_alias
          default: ${var.champion_alias}
        - name: challenger_alias
          default: ${var.challenger_alias}
        - name: endpoint_name
          default: capability-guides-model-${bundle.target}
        - name: workload_size
          default: ${var.serving_workload_size}
        - name: scale_to_zero
          default: "${var.serving_scale_to_zero}"
        - name: target
          default: ${bundle.target}
        # Approval input. Empty means the run stops at the gate and leaves the model unpromoted.
        - name: approved_by
          default: ""
      tasks:
        - task_key: train_and_register
          notebook_task:
            notebook_path: ../guides/model-deployment-cicd/01_train_and_register.py
            base_parameters:
              job_run_id: "{{job.run_id}}"

        - task_key: run_tests
          depends_on:
            - task_key: train_and_register
          notebook_task:
            notebook_path: ../guides/model-deployment-cicd/02_run_tests.py
            base_parameters:
              model_version: "{{tasks.train_and_register.values.model_version}}"

        - task_key: approval_gate
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: ../guides/model-deployment-cicd/03_approval_gate.py
            base_parameters:
              model_version: "{{tasks.train_and_register.values.model_version}}"

        - task_key: deploy_endpoint
          depends_on:
            - task_key: approval_gate
          notebook_task:
            notebook_path: ../guides/model-deployment-cicd/04_deploy_endpoint.py
            base_parameters:
              promoted: "{{tasks.approval_gate.values.promoted}}"

        - task_key: record_release
          depends_on:
            - task_key: deploy_endpoint
          notebook_task:
            notebook_path: ../guides/model-deployment-cicd/05_record_release.py
            base_parameters:
              model_version: "{{tasks.train_and_register.values.model_version}}"
              status: "{{tasks.deploy_endpoint.values.status}}"
              endpoint: "{{tasks.deploy_endpoint.values.endpoint}}"
              served_version: "{{tasks.deploy_endpoint.values.served_version}}"
              latency_ms: "{{tasks.deploy_endpoint.values.latency_ms}}"
              job_run_id: "{{job.run_id}}"
