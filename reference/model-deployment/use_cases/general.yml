# Use-case spec: training data, label, model name, features, and seed.
# src/common.py reads it; every task in the release job uses the same file.
# Data: UCI Online Retail II (CC BY 4.0), invoice lines from a UK online retailer, Dec 2009 to Dec 2011.
# Chen, D. (2012). Online Retail II [Dataset]. UCI Machine Learning Repository. https://doi.org/10.24432/C5CG6D
name: general
seed: 20261014

model:
  name: retail_churn_classifier
  description: Predicts whether a customer places no order in the 6 months after the snapshot date

data:
  dataset: online_retail_ii                    # a key of public_data.SOURCES
  transactions_table: release_retail_transactions
  table: churn_training_data                   # one row per customer at snapshot_date
  key: customer_id
  snapshot_date: "2010-09-01"
  holdout_mod: 5          # customers with customer_id % 5 = 0 form the holdout used by the tests
  # Model-only columns computed on the snapshot. Single-order customers have no order gap yet.
  derived: {order_gap_days: "coalesce(days_between_orders, days_since_purchase)"}

label:
  name: churned
  window_months: 6

features:
  - tenure_months
  - monthly_spend
  - returns
  - products_per_order
  - days_since_purchase
  - order_gap_days
