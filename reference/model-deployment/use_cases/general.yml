# Use-case spec: training data, label, model name, features, and seed.
# src/common.py reads it; every task in the release job uses the same file.
name: general
seed: 20261014

model:
  name: release_churn_classifier
  description: Predicts whether a customer churns within 90 days

data:
  table: churn_training_data
  rows: 20000
  holdout_mod: 5          # rows with id % 5 = 0 form the holdout used by the tests
  columns:                # generated with dbldatagen (uniform random, fixed seed)
    - {name: tenure_months, type: int, min: 1, max: 72}
    - {name: monthly_spend, type: double, min: 10, max: 300}
    - {name: support_tickets, type: int, min: 0, max: 12}
    - {name: usage_score, type: double, min: 0, max: 100}
    - {name: days_since_login, type: int, min: 0, max: 90}
    - {name: noise, type: double, min: 0, max: 1}   # hidden driver, never a feature

label:
  name: churned
  # 1 when the weighted risk score passes the cut-off. `noise` keeps the task from being separable.
  expr: >-
    CAST((0.04 * support_tickets + 0.012 * days_since_login - 0.01 * tenure_months
          - 0.006 * usage_score + 0.002 * monthly_spend + 0.4 * noise) > 0.63 AS INT)

features:
  - tenure_months
  - monthly_spend
  - support_tickets
  - usage_score
  - days_since_login
