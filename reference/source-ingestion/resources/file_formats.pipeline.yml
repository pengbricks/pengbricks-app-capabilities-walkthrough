resources:
  pipelines:
    capability_guides_file_formats_pipeline:
      name: capability-guides-file-formats
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        formats_path: /Volumes/${var.catalog}/${var.schema}/source_landing/formats
        excel_sheet: Orders
      tags:
        capability_guide_use_case: ${var.use_case}
      libraries:
        - glob:
            include: ../guides/file-format-ingestion/pipeline/**
