resources:
  pipelines:
    capability_guides_file_formats_pipeline:
      name: capability-guides-file-formats
      catalog: ${var.catalog}
      schema: ${resources.schemas.capability_guides_source_ingestion.name}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        formats_path: /Volumes/${var.catalog}/${resources.schemas.capability_guides_source_ingestion.name}/landing/formats
        excel_sheet: Orders
      tags:
        capability_guide_use_case: ${var.use_case}
      libraries:
        - glob:
            include: ../src/pipelines/file_formats/**
