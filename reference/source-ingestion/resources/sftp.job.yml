# SFTP retrieval: store credentials in a secret scope, copy new files to a volume, ingest them with
# Auto Loader, then prove a second fetch finds nothing new.
resources:
  jobs:
    capability_guides_sftp:
      name: capability-guides-sftp
      description: Copies new files from an SFTP server to a volume and ingests them with Auto Loader.
      tags:
        capability_guide_job: capability_guides_sftp
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.capability_guides_source_ingestion.name}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: tools
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.70
              - pyyaml>=6
              - paramiko>=3.4
      tasks:
        - task_key: setup_secrets
          environment_key: tools
          spark_python_task:
            python_file: ../src/setup_sftp_secrets.py
            parameters:
              - --src-dir=${workspace.file_path}/src
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: fetch_files
          depends_on:
            - task_key: setup_secrets
          environment_key: tools
          spark_python_task:
            python_file: ../src/fetch_sftp_files.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
              - --task=fetch_files
              - --allow-volume-fallback

        - task_key: ingest_files
          depends_on:
            - task_key: fetch_files
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_sftp_pipeline.id}

        - task_key: refetch_finds_nothing
          depends_on:
            - task_key: ingest_files
          environment_key: tools
          spark_python_task:
            python_file: ../src/fetch_sftp_files.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
              - --task=refetch_finds_nothing
              - --expect-no-new-files
              - --allow-volume-fallback

        - task_key: verify_tables
          depends_on:
            - task_key: refetch_finds_nothing
          environment_key: tools
          spark_python_task:
            python_file: ../src/verify_sftp_tables.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
