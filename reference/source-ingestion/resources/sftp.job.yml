# SFTP retrieval: store credentials in a secret scope, copy new files to a volume, ingest them with
# Auto Loader, then prove a second fetch finds nothing new.
resources:
  jobs:
    capability_guides_sftp:
      name: capability-guides-sftp
      description: Copies new files from an SFTP server to a volume and ingests them with Auto Loader.
      tags:
        capability_guide_job: capability_guides_sftp
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: setup_secrets
          notebook_task:
            notebook_path: ../guides/sftp-ingestion/01_setup_secrets.py

        - task_key: fetch_files
          depends_on:
            - task_key: setup_secrets
          notebook_task:
            notebook_path: ../guides/sftp-ingestion/02_fetch_files.py
            base_parameters:
              run_id: "{{job.run_id}}"

        - task_key: ingest_files
          depends_on:
            - task_key: fetch_files
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_sftp_pipeline.id}

        - task_key: inspect_pipeline
          depends_on:
            - task_key: ingest_files
          notebook_task:
            notebook_path: ../guides/sftp-ingestion/03_run_pipeline.py
            base_parameters:
              run_pipeline: "false"

        - task_key: refetch_finds_nothing
          depends_on:
            - task_key: inspect_pipeline
          notebook_task:
            notebook_path: ../guides/sftp-ingestion/04_refetch_finds_nothing.py
            base_parameters:
              run_id: "{{job.run_id}}"

        - task_key: verify_tables
          depends_on:
            - task_key: refetch_finds_nothing
          notebook_task:
            notebook_path: ../guides/sftp-ingestion/05_verify_tables.py
