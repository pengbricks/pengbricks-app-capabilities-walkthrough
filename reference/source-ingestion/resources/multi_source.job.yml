# Multi-source pipeline: prepare a database extract, landed files, and API output, then combine
# them in one Lakeflow Declarative Pipeline.
resources:
  jobs:
    capability_guides_multi_source:
      name: capability-guides-multi-source
      description: Builds one conformed customers table from a database extract, landed files, and API pages.
      tags:
        capability_guide_job: capability_guides_multi_source
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: prepare_inputs
          notebook_task:
            notebook_path: ../guides/multi-source-pipeline/01_prepare_inputs.py

        - task_key: combine_sources
          depends_on:
            - task_key: prepare_inputs
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_multi_source_pipeline.id}
            full_refresh: true

        - task_key: inspect_pipeline
          depends_on:
            - task_key: combine_sources
          notebook_task:
            notebook_path: ../guides/multi-source-pipeline/02_run_pipeline.py
            base_parameters:
              run_pipeline: "false"

        - task_key: verify_conformed
          depends_on:
            - task_key: inspect_pipeline
          notebook_task:
            notebook_path: ../guides/multi-source-pipeline/03_verify_conformed.py
