# Multi-source pipeline: prepare a database extract, landed files, and API output, then combine
# them in one Lakeflow Declarative Pipeline.
resources:
  jobs:
    capability_guides_multi_source:
      name: capability-guides-multi-source
      description: Builds one conformed customers table from a database extract, landed files, and API pages.
      tags:
        capability_guide_job: capability_guides_multi_source
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.capability_guides_source_ingestion.name}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: tools
          spec:
            environment_version: "4"
            dependencies:
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
              - requests>=2.31
              - pandas
      tasks:
        - task_key: prepare_inputs
          environment_key: tools
          spark_python_task:
            python_file: ../src/prepare_multi_source_inputs.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: combine_sources
          depends_on:
            - task_key: prepare_inputs
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_multi_source_pipeline.id}
            full_refresh: true

        - task_key: verify_conformed
          depends_on:
            - task_key: combine_sources
          environment_key: tools
          spark_python_task:
            python_file: ../src/verify_multi_source.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --src-dir=${workspace.file_path}/src
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
