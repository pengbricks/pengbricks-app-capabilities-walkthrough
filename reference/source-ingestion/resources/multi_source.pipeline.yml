resources:
  pipelines:
    capability_guides_multi_source_pipeline:
      name: capability-guides-multi-source
      catalog: ${var.catalog}
      schema: ${resources.schemas.capability_guides_source_ingestion.name}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        landing_path: /Volumes/${var.catalog}/${resources.schemas.capability_guides_source_ingestion.name}/landing/multi_source
        catalog: ${var.catalog}
        schema: ${resources.schemas.capability_guides_source_ingestion.name}
      tags:
        capability_guide_use_case: ${var.use_case}
      libraries:
        - glob:
            include: ../src/pipelines/multi_source/**
