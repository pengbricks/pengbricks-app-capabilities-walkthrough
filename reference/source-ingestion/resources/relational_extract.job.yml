# Relational database extracts: build a source in Lakebase Postgres, expose it through Lakehouse
# Federation, land full tables and a custom SQL result, then compare them with the source.
resources:
  jobs:
    capability_guides_relational_extract:
      name: capability-guides-relational-extract
      description: Extracts full tables and a custom SQL result from Lakebase Postgres and compares them with the source.
      tags:
        capability_guide_job: capability_guides_relational_extract
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: lakebase_project
          default: ${var.lakebase_project}
      tasks:
        - task_key: create_source
          notebook_task:
            notebook_path: ../guides/relational-db-ingestion/01_create_source.py

        - task_key: setup_federation
          depends_on:
            - task_key: create_source
          notebook_task:
            notebook_path: ../guides/relational-db-ingestion/02_setup_federation.py

        - task_key: extract
          depends_on:
            - task_key: setup_federation
          notebook_task:
            notebook_path: ../guides/relational-db-ingestion/03_extract.py
            base_parameters:
              run_id: "{{job.run_id}}"

        - task_key: compare_with_source
          depends_on:
            - task_key: extract
          notebook_task:
            notebook_path: ../guides/relational-db-ingestion/04_compare_with_source.py
            base_parameters:
              run_id: "{{job.run_id}}"
