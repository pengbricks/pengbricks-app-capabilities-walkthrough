resources:
  pipelines:
    capability_guides_sftp_pipeline:
      name: capability-guides-sftp
      catalog: ${var.catalog}
      schema: ${resources.schemas.capability_guides_source_ingestion.name}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        sftp_path: /Volumes/${var.catalog}/${resources.schemas.capability_guides_source_ingestion.name}/landing/sftp
      tags:
        capability_guide_use_case: ${var.use_case}
      libraries:
        - glob:
            include: ../src/pipelines/sftp/**
