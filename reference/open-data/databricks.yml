bundle:
  name: capability-guides-open-data

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schema
  warehouse_id:
    description: SQL warehouse for SQL tasks
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  notification_email:
    description: Address that receives job failure emails
  schema:
    description: Schema for this bundle's tables
    default: capability_guides_open_data
  use_case:
    description: Use-case spec under use_cases/ that drives data, sharing, Iceberg, and integration settings
    default: general
  release:
    description: Release identifier recorded in resource tags
    default: local

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
