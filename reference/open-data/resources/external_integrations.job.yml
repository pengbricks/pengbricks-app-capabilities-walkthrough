# Partner tool integrations: a SQL Connector client against a SQL warehouse, and Lakehouse
# Federation over a UC connection to Postgres (a Lakebase project stands in for the external database).
resources:
  jobs:
    capability_guides_external_integrations:
      name: capability-guides-external-integrations
      description: Queries a SQL warehouse through the Databricks SQL Connector for Python, then reads an external Postgres database through a Unity Catalog connection and foreign catalog.
      tags:
        capability_guide_job: capability_guides_external_integrations
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: integrations
          spec:
            environment_version: "4"
            dependencies:
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
              - databricks-sql-connector>=4.0
              - psycopg[binary]>=3.2
              - databricks-sdk>=0.70
      tasks:
        - task_key: prepare_data
          environment_key: integrations
          spark_python_task:
            python_file: ../src/prepare_orders.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: sql_connector_client
          depends_on:
            - task_key: prepare_data
          environment_key: integrations
          spark_python_task:
            python_file: ../src/sql_connector_check.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --warehouse-id=${var.warehouse_id}

        - task_key: lakehouse_federation
          depends_on:
            - task_key: prepare_data
          environment_key: integrations
          spark_python_task:
            python_file: ../src/federation_check.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
