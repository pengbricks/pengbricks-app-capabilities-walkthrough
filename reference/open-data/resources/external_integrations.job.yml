# Partner tool integrations: a SQL Connector client against a SQL warehouse, and Lakehouse
# Federation over a UC connection to Postgres (a Lakebase project stands in for the external database).
resources:
  jobs:
    capability_guides_external_integrations:
      name: capability-guides-external-integrations
      description: Queries a SQL warehouse through the Databricks SQL Connector for Python, then reads an external Postgres database through a Unity Catalog connection and foreign catalog.
      tags:
        capability_guide_job: capability_guides_external_integrations
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: lakebase_project
          default: ${var.lakebase_project}
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/external-integrations/01_prepare_data.py

        - task_key: sql_connector_client
          depends_on:
            - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/external-integrations/02_sql_connector_client.py

        - task_key: lakehouse_federation
          depends_on:
            - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/external-integrations/03_lakehouse_federation.py
