# Governed data sharing: share a table and a row-limiting view, grant, read with the Delta Sharing
# client, revoke, show access fails, and pull the audit events.
resources:
  jobs:
    capability_guides_data_sharing:
      name: capability-guides-data-sharing
      description: Shares a governed view and table with an open-sharing recipient, reads them through the Delta Sharing protocol, revokes access, and records the audit events.
      tags:
        capability_guide_job: capability_guides_data_sharing
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: sharing
          spec:
            environment_version: "4"
            dependencies:
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
              - delta-sharing>=1.2
              - requests
              - databricks-sdk>=0.70
      tasks:
        - task_key: prepare_data
          environment_key: sharing
          spark_python_task:
            python_file: ../src/prepare_sharing_data.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: share_and_read
          depends_on:
            - task_key: prepare_data
          environment_key: sharing
          spark_python_task:
            python_file: ../src/share_and_read.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: collect_audit_events
          depends_on:
            - task_key: share_and_read
          environment_key: sharing
          spark_python_task:
            python_file: ../src/collect_share_audit.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --started-epoch={{tasks.share_and_read.values.started_epoch}}
              - --final-action={{tasks.share_and_read.values.final_action}}
