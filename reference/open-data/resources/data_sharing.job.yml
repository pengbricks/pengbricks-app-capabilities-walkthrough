# Governed data sharing: share a table and a row-limiting view, grant, read with the Delta Sharing
# client, revoke, show access fails, and pull the audit events.
resources:
  jobs:
    capability_guides_data_sharing:
      name: capability-guides-data-sharing
      description: Shares a governed view and table with an open-sharing recipient, reads them through the Delta Sharing protocol, revokes access, and records the audit events.
      tags:
        capability_guide_job: capability_guides_data_sharing
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/data-sharing/01_prepare_data.py

        - task_key: share_and_read
          depends_on:
            - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/data-sharing/02_share_and_read.py

        - task_key: collect_audit_events
          depends_on:
            - task_key: share_and_read
          notebook_task:
            notebook_path: ../guides/data-sharing/03_collect_audit.py
            base_parameters:
              started_epoch: "{{tasks.share_and_read.values.started_epoch}}"
              final_action: "{{tasks.share_and_read.values.final_action}}"
