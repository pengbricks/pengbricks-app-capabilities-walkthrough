# Lakebase project for the guide (Beta resources, Databricks CLI 0.287.0 or later).
#
# A new project starts with a production branch, a databricks_postgres database, and a read-write
# endpoint named primary. The project resource sets that endpoint's size and scale to zero. The
# production branch is created by the platform, so it is not declared here: declaring it would try
# to create a branch that already exists.
#
# The dev branch expires after seven days. Creating a branch also creates its read-write endpoint,
# named primary, with the project's default endpoint settings (scale to zero after five idle
# minutes), so the bundle declares no endpoint for it: declaring one fails with "read_write endpoint
# already exists". Declare a postgres_endpoint only for an extra endpoint, such as a read replica.
# Redeploy after the branch expires and the bundle creates it again.
resources:
  postgres_projects:
    lakebase_apps:
      project_id: ${var.lakebase_project}
      display_name: Capability guides, app development with Lakebase
      pg_version: 17
      # Delete the project's data when the bundle is destroyed, so a destroy leaves nothing billing.
      purge_on_delete: true
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        # Scale to zero after five idle minutes. The default is 24 hours, which suits production.
        suspend_timeout_duration: 300s

  postgres_branches:
    dev:
      parent: ${resources.postgres_projects.lakebase_apps.id}
      branch_id: dev
      source_branch: ${resources.postgres_projects.lakebase_apps.id}/branches/production
      ttl: 604800s

