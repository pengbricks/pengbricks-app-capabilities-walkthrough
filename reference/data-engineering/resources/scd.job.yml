resources:
  jobs:
    capability_guides_scd:
      name: capability_guides_scd
      description: Runs the SCD pipeline on an initial snapshot, then on a change batch, and records counts before and after.
      tags:
        capability_guide_job: capability_guides_scd
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: prepare_initial
          notebook_task:
            notebook_path: ../guides/scd-change-capture/01_prepare_initial.py
        - task_key: pipeline_initial
          depends_on:
            - task_key: prepare_initial
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_scd_pipeline.id}
            full_refresh: true
        - task_key: inspect_initial
          depends_on:
            - task_key: pipeline_initial
          notebook_task:
            notebook_path: ../guides/scd-change-capture/02_run_pipeline_initial.py
            base_parameters:
              run_pipeline: "false"
        - task_key: counts_before
          depends_on:
            - task_key: inspect_initial
          notebook_task:
            notebook_path: ../guides/scd-change-capture/03_counts_before.py
        - task_key: prepare_changes
          depends_on:
            - task_key: counts_before
          notebook_task:
            notebook_path: ../guides/scd-change-capture/04_prepare_changes.py
        - task_key: pipeline_changes
          depends_on:
            - task_key: prepare_changes
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_scd_pipeline.id}
            full_refresh: false
        - task_key: inspect_changes
          depends_on:
            - task_key: pipeline_changes
          notebook_task:
            notebook_path: ../guides/scd-change-capture/05_run_pipeline_changes.py
            base_parameters:
              run_pipeline: "false"
        - task_key: counts_after
          depends_on:
            - task_key: inspect_changes
          notebook_task:
            notebook_path: ../guides/scd-change-capture/06_counts_after.py
