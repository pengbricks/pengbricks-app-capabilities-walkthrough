resources:
  jobs:
    capability_guides_target_loading:
      name: capability_guides_target_loading
      description: MERGEs inserts, updates, and deletes into a Delta target, then writes CSV, pipe-delimited, Excel, and JSON files to a volume.
      tags:
        capability_guide_job: capability_guides_target_loading
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: volume
          default: ${resources.volumes.capability_guides_data_engineering_exports.name}
      tasks:
        - task_key: prepare_target
          notebook_task:
            notebook_path: ../guides/target-loading-outputs/01_prepare_target.py
        - task_key: merge_target
          depends_on:
            - task_key: prepare_target
          notebook_task:
            notebook_path: ../guides/target-loading-outputs/02_merge_target.py
        - task_key: write_outputs
          depends_on:
            - task_key: merge_target
          notebook_task:
            notebook_path: ../guides/target-loading-outputs/03_write_outputs.py
