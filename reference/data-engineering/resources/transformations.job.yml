resources:
  jobs:
    capability_guides_transformations:
      name: capability_guides_transformations
      description: Runs the transformation patterns pipeline and checks row counts per materialized view.
      tags:
        capability_guide_job: capability_guides_transformations
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: generate_sources
          notebook_task:
            notebook_path: ../guides/transformation-patterns/01_generate_sources.py
        - task_key: run_pipeline
          depends_on:
            - task_key: generate_sources
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_transformations_pipeline.id}
            full_refresh: true
        - task_key: inspect_pipeline
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../guides/transformation-patterns/02_run_pipeline.py
            base_parameters:
              run_pipeline: "false"
        - task_key: check_row_counts
          depends_on:
            - task_key: inspect_pipeline
          notebook_task:
            notebook_path: ../guides/transformation-patterns/03_check_row_counts.py
