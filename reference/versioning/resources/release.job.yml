# Publishes three versions of a data contract: nonbreaking change in place, breaking change
# behind a compatibility view, with a gate, a registry, and consumer notifications.
resources:
  jobs:
    capability_guides_versioning_release:
      name: capability-guides-versioning-release
      description: Applies contract v1.0.0, v1.1.0 (nonbreaking) and v2.0.0 (breaking) with a compatibility gate, registry, and consumer notifications.
      tags:
        capability_guide_job: capability_guides_versioning_release
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_success:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: release
          default: ${var.release}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/versioning/01_generate_data.py

        - task_key: compatibility_gate
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/versioning/02_compatibility_gate.py

        - task_key: apply_v1
          depends_on:
            - task_key: compatibility_gate
          notebook_task:
            notebook_path: ../guides/versioning/03_apply_v1.py

        - task_key: apply_v2
          depends_on:
            - task_key: apply_v1
          notebook_task:
            notebook_path: ../guides/versioning/04_apply_v2.py

        - task_key: show_traceability
          depends_on:
            - task_key: apply_v2
          notebook_task:
            notebook_path: ../guides/versioning/05_show_traceability.py

        - task_key: notify_consumers
          depends_on:
            - task_key: show_traceability
          notebook_task:
            notebook_path: ../guides/versioning/06_notify_consumers.py
