bundle:
  name: capability-guides-versioning

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schema
  warehouse_id:
    description: SQL warehouse (unused by the job tasks, kept for parity with the other bundles)
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  notification_email:
    description: Address that receives the release announcement
  schema:
    description: Schema for this bundle's tables and views
    default: capability_guides
  use_case:
    description: Use-case spec under use_cases/ that names the dataset, owner, consumers, and seed
    default: general
  release:
    description: Release identifier (a Git tag or commit SHA) recorded in tags and the contract registry
    default: local

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
    variables:
      schema: dev_${workspace.current_user.short_name}_capability_guides
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
