resources:
  jobs:
    capability_guides_monitoring_snapshot:
      name: capability-guides-monitoring-snapshot
      description: Materializes ops_* monitoring tables from system tables and the Jobs API.
      tags:
        capability_guide_job: capability_guides_monitoring_snapshot
        capability_guide_use_case: ${var.use_case}
      email_notifications:
        on_failure:
          - ${var.alert_email}
        on_duration_warning_threshold_exceeded:
          - ${var.alert_email}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: lookback_days
          default: "${var.lookback_days}"
        - name: audit_lookback_days
          default: "${var.audit_lookback_days}"
        - name: guide_tag_key
          default: ${var.guide_tag_key}
        - name: use_case_tag_key
          default: ${var.use_case_tag_key}
        - name: alert_email
          default: ${var.alert_email}
      tasks:
        - task_key: setup_context_and_alert_routing
          notebook_task:
            notebook_path: ../guides/monitoring/01_setup_context_and_alert_routing.py
        - task_key: ops_job_runs
          depends_on: [{task_key: setup_context_and_alert_routing}]
          notebook_task:
            notebook_path: ../guides/monitoring/02_ops_job_runs.py
        - task_key: ops_failures
          depends_on: [{task_key: ops_job_runs}]
          notebook_task:
            notebook_path: ../guides/monitoring/03_ops_failures.py
        - task_key: ops_usage_cost
          depends_on: [{task_key: setup_context_and_alert_routing}]
          notebook_task:
            notebook_path: ../guides/monitoring/04_ops_usage_cost.py
        - task_key: ops_compute_capacity
          depends_on: [{task_key: setup_context_and_alert_routing}]
          notebook_task:
            notebook_path: ../guides/monitoring/05_ops_compute_capacity.py
        - task_key: ops_audit_events
          depends_on: [{task_key: setup_context_and_alert_routing}]
          notebook_task:
            notebook_path: ../guides/monitoring/06_ops_audit_events.py
