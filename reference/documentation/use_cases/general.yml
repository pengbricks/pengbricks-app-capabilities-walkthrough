# Domain spec for the sample tables. Code in src/ is generic; change this file (or add a sibling
# file and pass --var use_case=<name>) to stamp out a different use case.
use_case: general
seed: 42
tags:
  domain: sales
  data_owner_team: data-platform
  sensitivity: internal   # the workspace tag policy only allows pii, internal, public
tables:
  - name: bronze_orders
    kind: generate          # generated from the column specs below
    rows: 1000
    comment_hint: Raw order events as received, with duplicates and missing customer ids.
    columns:
      - {name: order_id, type: bigint, kind: int_range, min: 1, max: 950}
      - {name: customer_id, type: bigint, kind: int_range, min: 1, max: 50, null_pct: 0.06}
      - {name: status, type: string, kind: choice, values: [placed, shipped, cancelled], weights: [6, 3, 1]}
      - {name: amount, type: double, kind: float_range, min: 10.0, max: 100.0, round: 2}
      - {name: order_date, type: date, kind: date_range, begin: "2026-01-01", end: "2026-03-31"}
  - name: silver_orders
    kind: sql
    comment_hint: Cleaned orders, one row per order_id, excluding cancelled orders and rows without a customer.
    sql: |
      SELECT order_id, customer_id, status, amount, order_date
      FROM {bronze_orders}
      WHERE customer_id IS NOT NULL AND status <> 'cancelled'
      QUALIFY row_number() OVER (PARTITION BY order_id ORDER BY order_date) = 1
  - name: gold_daily_revenue
    kind: sql
    comment_hint: Daily revenue rollup built from silver_orders.
    sql: |
      SELECT order_date, COUNT(*) AS order_count, COUNT(DISTINCT customer_id) AS customer_count,
             ROUND(SUM(amount), 2) AS revenue
      FROM {silver_orders}
      GROUP BY order_date
