resources:
  jobs:
    capability_guides_documentation_refresh:
      name: capability-guides-documentation-refresh
      tags:
        capability_guide_job: capability_guides_documentation_refresh
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: model_endpoint
          default: ${var.model_endpoint}
      tasks:
        - task_key: build_sample_tables
          notebook_task:
            notebook_path: ../guides/documentation-generation/01_build_sample_tables.py
        - task_key: generate_docs
          depends_on:
            - task_key: build_sample_tables
          notebook_task:
            notebook_path: ../guides/documentation-generation/02_generate_docs.py
