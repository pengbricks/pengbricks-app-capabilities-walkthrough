resources:
  jobs:
    capability_guides_documentation_refresh:
      name: capability-guides-documentation-refresh
      tags:
        capability_guide_job: capability_guides_documentation_refresh
        capability_guide_use_case: ${var.use_case}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - dbldatagen
              - pyyaml
      tasks:
        - task_key: build_sample_tables
          environment_key: default
          spark_python_task:
            python_file: ../src/build_sample_tables.py
            parameters:
              - ${var.catalog}
              - ${var.schema}
              - ${workspace.file_path}/use_cases/${var.use_case}.yml
              - ${workspace.file_path}/src
        - task_key: generate_docs
          depends_on:
            - task_key: build_sample_tables
          environment_key: default
          spark_python_task:
            python_file: ../src/generate_docs.py
            parameters:
              - ${var.catalog}
              - ${var.schema}
              - ${var.model_endpoint}
              - /Volumes/${var.catalog}/${var.schema}/${resources.volumes.docs.name}
              - ${workspace.file_path}/src
              - ${workspace.file_path}/use_cases/${var.use_case}.yml
