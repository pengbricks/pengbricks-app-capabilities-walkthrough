resources:
  jobs:
    capability_guides_developer_experience_workflow:
      name: capability-guides-developer-experience-workflow
      tags:
        capability_guide_job: capability_guides_developer_experience_workflow
        capability_guide_use_case: ${var.use_case}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: output_table
          default: ${var.output_table}
        - name: key_column
          default: ${var.key_column}
        - name: value_column
          default: ${var.value_column}
      tasks:
        - task_key: unit_tests
          notebook_task:
            notebook_path: ../guides/ide-developer-experience/01_unit_tests.py
        - task_key: transform
          depends_on:
            - task_key: unit_tests
          notebook_task:
            notebook_path: ../guides/ide-developer-experience/02_transform.py
        - task_key: sql_checks
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../guides/ide-developer-experience/03_sql_checks.py
