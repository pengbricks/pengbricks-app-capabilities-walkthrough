# Platform administration: routine admin tasks scripted with the SDK, each recorded in admin_actions.
resources:
  jobs:
    capability_guides_platform_admin:
      name: capability-guides-platform-admin
      description: Checks workspace settings, ensures a group and schema grant, applies a policy, reviews capacity and audit logs, and lists routine support items. Every step writes to admin_actions.
      tags:
        capability_guide_job: capability_guides_platform_admin
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 1800
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: init_ledger
          notebook_task:
            notebook_path: ../guides/platform-administration/01_init_ledger.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: workspace_checks
          depends_on: [{task_key: init_ledger}]
          notebook_task:
            notebook_path: ../guides/platform-administration/02_workspace_checks.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: roles
          depends_on: [{task_key: workspace_checks}]
          notebook_task:
            notebook_path: ../guides/platform-administration/03_roles.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: policies
          depends_on: [{task_key: roles}]
          notebook_task:
            notebook_path: ../guides/platform-administration/04_policies.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: capacity
          depends_on: [{task_key: policies}]
          notebook_task:
            notebook_path: ../guides/platform-administration/05_capacity.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: audit_access
          depends_on: [{task_key: capacity}]
          notebook_task:
            notebook_path: ../guides/platform-administration/06_audit_access.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: routine_support
          depends_on: [{task_key: audit_access}]
          notebook_task:
            notebook_path: ../guides/platform-administration/07_routine_support.py
            base_parameters:
              run_id: "{{job.run_id}}"
