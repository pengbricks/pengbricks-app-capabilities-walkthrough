# Platform administration: routine admin tasks scripted with the SDK, each recorded in admin_actions.
resources:
  jobs:
    capability_guides_platform_admin:
      name: capability-guides-platform-admin
      description: Checks workspace settings, ensures a group and schema grant, applies a policy, reviews capacity and audit logs, and lists routine support items. Every step writes to admin_actions.
      tags:
        capability_guide_job: capability_guides_platform_admin
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 1800
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.capability_guides_platform_ops.name}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: sdk
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.70
              - pyyaml>=6
      tasks:
        - task_key: init_ledger
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=init_ledger
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
        - task_key: workspace_checks
          depends_on: [{task_key: init_ledger}]
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=workspace_checks
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
        - task_key: roles
          depends_on: [{task_key: workspace_checks}]
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=roles
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
        - task_key: policies
          depends_on: [{task_key: roles}]
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=policies
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
        - task_key: capacity
          depends_on: [{task_key: policies}]
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=capacity
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
        - task_key: audit_access
          depends_on: [{task_key: capacity}]
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=audit_access
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
        - task_key: routine_support
          depends_on: [{task_key: audit_access}]
          environment_key: sdk
          spark_python_task:
            python_file: ../src/platform_admin.py
            parameters:
              - --task=routine_support
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --run-id={{job.run_id}}
