# Maintenance window: pause every scheduled job tagged capability_guide_job, then restore them.
resources:
  jobs:
    capability_guides_bulk_pause:
      name: capability-guides-bulk-pause
      description: Pauses every scheduled job tagged capability_guide_job in one operation, records before and after states, then restores the jobs it paused.
      tags:
        capability_guide_job: capability_guides_bulk_pause
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.guide_schema.name}
        - name: use_case
          default: ${var.use_case}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.70
      tasks:
        - task_key: prepare
          environment_key: default
          spark_python_task:
            python_file: ../src/bulk_pause.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--schema={{job.parameters.schema}}", "--run-id={{job.run_id}}", "--phase=prepare"]
        - task_key: pause_all
          depends_on:
            - task_key: prepare
          environment_key: default
          spark_python_task:
            python_file: ../src/bulk_pause.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--schema={{job.parameters.schema}}", "--run-id={{job.run_id}}", "--phase=pause"]
        - task_key: resume_all
          depends_on:
            - task_key: pause_all
          environment_key: default
          spark_python_task:
            python_file: ../src/bulk_pause.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--schema={{job.parameters.schema}}", "--run-id={{job.run_id}}", "--phase=resume"]
        - task_key: cleanup_probe
          depends_on:
            - task_key: resume_all
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../src/bulk_pause.py
            parameters: ["--catalog={{job.parameters.catalog}}", "--schema={{job.parameters.schema}}", "--run-id={{job.run_id}}", "--phase=cleanup"]
