# Maintenance window: pause every scheduled job tagged capability_guide_job, then restore them.
resources:
  jobs:
    capability_guides_bulk_pause:
      name: capability-guides-bulk-pause
      description: Pauses every scheduled job tagged capability_guide_job in one operation, records before and after states, then restores the jobs it paused.
      tags:
        capability_guide_job: capability_guides_bulk_pause
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: prepare
          notebook_task:
            notebook_path: ../guides/orchestration-patterns/08_bulk_pause_prepare.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: pause_all
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: ../guides/orchestration-patterns/09_bulk_pause_pause_all.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: resume_all
          depends_on:
            - task_key: pause_all
          notebook_task:
            notebook_path: ../guides/orchestration-patterns/10_bulk_pause_resume_all.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: cleanup_probe
          depends_on:
            - task_key: resume_all
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../guides/orchestration-patterns/11_bulk_pause_cleanup_probe.py
            base_parameters:
              run_id: "{{job.run_id}}"
