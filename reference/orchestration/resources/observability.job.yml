# Lineage and drift detection: build a chain, read its lineage, detect schema drift and data drift.
resources:
  jobs:
    capability_guides_observability:
      name: capability-guides-observability
      description: Builds a source, silver, and gold chain, reads its lineage from system tables, detects schema drift from table history, and flags a data drift between two batches.
      tags:
        capability_guide_job: capability_guides_observability
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 5400
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: build_chain
          notebook_task:
            notebook_path: ../guides/data-observability/01_build_chain.py
        - task_key: read_lineage
          depends_on:
            - task_key: build_chain
          notebook_task:
            notebook_path: ../guides/data-observability/02_read_lineage.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: detect_schema_drift
          depends_on:
            - task_key: build_chain
          notebook_task:
            notebook_path: ../guides/data-observability/03_detect_schema_drift.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: detect_data_drift
          notebook_task:
            notebook_path: ../guides/data-observability/04_detect_data_drift.py
            base_parameters:
              run_id: "{{job.run_id}}"
