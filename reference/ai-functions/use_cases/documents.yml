# Document processing guide: sample documents, labels, extraction schemas, and checks.
# Every document is generated at run time (fpdf2, plus Pillow for the scanned receipts). All names, emails,
# and phone numbers are made up (example.com addresses, 555-01xx numbers). The fields listed here are the answer key.
volume: aif_documents
landing_folder: dp_landing
tables:
  raw: dp_documents_raw
  parsed: dp_documents_parsed
  classified: dp_documents_classified
  extracted_raw: dp_extract_responses
  extracted: dp_fields_extracted
  validated: dp_documents_validated
  quarantine: dp_documents_quarantine
  masked: dp_documents_masked
  truth: dp_truth
  run_log: dp_run_log
  results: dp_results
  billing: dp_billing_usage

# Pattern 3: classification. The label descriptions are part of the prompt.
classify:
  labels:
    invoice: "A bill from a vendor with an invoice number, a date, line items, and a total due"
    intake_form: "A filled-in request or application form with labeled fields for an applicant, a request id, and an amount"
    letter: "A business letter or memo from one organization to another with a date, a subject, and a requested action"
    receipt: "A scanned point-of-sale receipt with a merchant, a date, and a total paid"
  min_confidence: 0.7

# Pattern 4: extraction. One schema per document type.
extract:
  min_confidence: 0.8
  schemas:
    invoice:
      invoice_number: {type: string, description: "The invoice number, for example INV-2001"}
      vendor: {type: string, description: "The company that issued the invoice"}
      invoice_date: {type: string, description: "Invoice date as YYYY-MM-DD"}
      total: {type: number, description: "Total due in USD. Null if the document shows no total"}
    intake_form:
      request_id: {type: string, description: "The request id, for example REQ-3001"}
      applicant_name: {type: string, description: "Full name of the applicant"}
      request_date: {type: string, description: "Date of the request as YYYY-MM-DD. Null if absent"}
      category: {type: string, description: "The request category exactly as written on the form"}
      amount_requested: {type: number, description: "Amount requested in USD"}
    letter:
      sender_org: {type: string, description: "The organization that sent the letter"}
      letter_date: {type: string, description: "Date of the letter as YYYY-MM-DD. Null if absent"}
      subject: {type: string, description: "The subject line"}
      action_requested: {type: string, description: "What the sender asks the recipient to do, in one short phrase"}
    receipt:
      merchant: {type: string, description: "The merchant name printed at the top"}
      receipt_date: {type: string, description: "Date on the receipt as YYYY-MM-DD"}
      total: {type: number, description: "Total paid in USD"}
  required:
    invoice: [invoice_number, vendor, invoice_date, total]
    intake_form: [request_id, applicant_name, request_date, category]
    letter: [sender_org, letter_date, subject]
    receipt: [merchant, receipt_date, total]

# Pattern 5: validation. A document is quarantined when a required field is null, a field's confidence is
# below extract.min_confidence, or a date or amount is not valid.
validate:
  max_total: 100000

# Pattern 6: masking. The labels ai_mask hides in the shared copy of the text.
mask:
  labels: [person, email, phone]

# Cost measurement: how long to wait for billing rows before recording what is there.
cost:
  poll_minutes: 4
  poll_seconds: 60

# The documents. `expect_quarantine: true` marks a document built to fail validation (a missing field), so the run
# can check that quarantine catches it. `degrade: true` makes a receipt faint, noisy, and tilted to test OCR; it is
# not expected to fail validation, and the run reports what the parser did with it.
