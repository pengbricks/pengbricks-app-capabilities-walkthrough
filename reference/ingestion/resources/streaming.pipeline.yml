resources:
  pipelines:
    capability_guides_ingestion_streaming:
      name: capability-guides-ingestion-streaming
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      photon: true
      channel: CURRENT
      configuration:
        landing_events_path: /Volumes/${var.catalog}/${var.schema}/landing/events/
        catalog: ${var.catalog}
        schema: ${var.schema}
        use_case: ${var.use_case}
      tags:
        capability_guide_job: capability_guides_ingestion_streaming
        capability_guide_use_case: ${var.use_case}
      libraries:
        - glob:
            include: ../guides/batch-real-time-ingestion/pipeline/**
