resources:
  volumes:
    capability_guides_ingestion_landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.capability_guides_ingestion.name}
      name: landing
      comment: Landing zone for generated provider files and streaming events
      grants:
        # Lets the app's "Drop into Auto Loader" panel write example documents.
        - principal: ${var.app_service_principal}
          privileges: [READ_VOLUME, WRITE_VOLUME]
