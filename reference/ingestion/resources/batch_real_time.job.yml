# Batch and real-time ingestion: batch framework run, then streaming events through a
# Lakeflow Declarative Pipeline, then latency and throughput metrics.
resources:
  jobs:
    capability_guides_batch_real_time:
      name: capability-guides-batch-real-time
      description: Runs the batch framework, streams events through the pipeline, and records latency and throughput.
      tags:
        capability_guide_job: capability_guides_batch_real_time
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: batch_ingest
          run_job_task:
            job_id: ${resources.jobs.capability_guides_ingestion_framework.id}
            job_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              use_case: "{{job.parameters.use_case}}"

        - task_key: land_stream_events
          notebook_task:
            notebook_path: ../guides/batch-real-time-ingestion/01_land_stream_events.py

        - task_key: streaming_pipeline
          depends_on:
            - task_key: batch_ingest
            - task_key: land_stream_events
          pipeline_task:
            pipeline_id: ${resources.pipelines.capability_guides_ingestion_streaming.id}

        # The pipeline task above runs the update; this notebook only inspects its output.
        - task_key: inspect_pipeline
          depends_on:
            - task_key: streaming_pipeline
          notebook_task:
            notebook_path: ../guides/batch-real-time-ingestion/02_run_pipeline.py
            base_parameters:
              run_pipeline: "false"
              pipeline_id: ${resources.pipelines.capability_guides_ingestion_streaming.id}

        - task_key: record_metrics
          depends_on:
            - task_key: inspect_pipeline
          notebook_task:
            notebook_path: ../guides/batch-real-time-ingestion/03_record_metrics.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              pipeline_id: ${resources.pipelines.capability_guides_ingestion_streaming.id}
