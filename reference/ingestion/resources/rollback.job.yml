# Rollback: restore a Delta table to an earlier version after a bad write.
resources:
  jobs:
    capability_guides_rollback:
      name: capability-guides-rollback
      description: Restores the silver table to an earlier Delta version. Leave version blank to undo the latest write.
      tags:
        capability_guide_job: capability_guides_rollback
        capability_guide_use_case: ${var.use_case}
        environment: ${var.environment}
      parameters:
        - name: table
          default: ${var.catalog}.${var.schema}.transactions_silver
        - name: version
          default: ""
      tasks:
        - task_key: restore_table
          notebook_task:
            notebook_path: ../guides/dataops/04_rollback_table.py
