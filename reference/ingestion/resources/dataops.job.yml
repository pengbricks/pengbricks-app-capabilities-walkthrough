# DataOps: retries, alerting, duration health rule, run history, audit trail, and rollback.
resources:
  jobs:
    capability_guides_dataops:
      name: capability-guides-dataops
      description: Ingests a feed through a retry policy, alerts on failure or slow runs, and records run history and audit trail.
      tags:
        capability_guide_job: capability_guides_dataops
        capability_guide_use_case: ${var.use_case}
        environment: ${var.environment}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1200
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: land_files
          notebook_task:
            notebook_path: ../guides/dataops/01_land_files.py

        - task_key: ingest_with_retry
          depends_on:
            - task_key: land_files
          max_retries: 2
          min_retry_interval_millis: 15000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../guides/dataops/02_ingest_with_retry.py
            base_parameters:
              feed: provider_a
              run_id: "{{job.run_id}}"
              simulate_transient_failure: "true"

        - task_key: record_audit_trail
          depends_on:
            - task_key: ingest_with_retry
          notebook_task:
            notebook_path: ../guides/dataops/03_record_audit_trail.py
            base_parameters:
              job_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
