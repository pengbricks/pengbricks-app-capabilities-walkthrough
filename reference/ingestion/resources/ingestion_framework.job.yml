# Configuration vs code + Reusability / templatization.
# One shared framework task runs once per feed; feeds come from the use-case spec.
resources:
  jobs:
    capability_guides_ingestion_framework:
      name: capability-guides-ingestion-framework
      description: Lands every feed in the use case, runs the shared framework per feed, and compares results.
      tags:
        capability_guide_job: capability_guides_ingestion_framework
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: land_files
          notebook_task:
            notebook_path: ../guides/configuration-vs-code/01_land_files.py

        - task_key: ingest_each_feed
          depends_on:
            - task_key: land_files
          for_each_task:
            inputs: "{{tasks.land_files.values.feeds}}"
            concurrency: 4
            task:
              task_key: ingest_feed
              notebook_task:
                notebook_path: ../guides/configuration-vs-code/02_ingest_feeds.py
                base_parameters:
                  feed: "{{input}}"
                  run_id: "{{job.run_id}}"

        - task_key: compare_feeds
          depends_on:
            - task_key: ingest_each_feed
          notebook_task:
            notebook_path: ../guides/configuration-vs-code/03_compare_feeds.py
            base_parameters:
              run_id: "{{job.run_id}}"
