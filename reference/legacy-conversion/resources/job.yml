resources:
  jobs:
    capability_guides_legacy_conversion_assessment:
      name: capability-guides-legacy-conversion-assessment
      tags:
        capability_guide_job: capability_guides_legacy_conversion_assessment
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
      tasks:
        - task_key: assess
          notebook_task:
            notebook_path: ../guides/legacy-conversion/01_assess.py
        - task_key: convert
          depends_on: [{task_key: assess}]
          notebook_task:
            notebook_path: ../guides/legacy-conversion/02_convert.py
        - task_key: test
          depends_on: [{task_key: convert}]
          notebook_task:
            notebook_path: ../guides/legacy-conversion/03_reconcile.py
        - task_key: record
          depends_on: [{task_key: test}]
          notebook_task:
            notebook_path: ../guides/legacy-conversion/04_record.py
