# Access management: group, dev-like and prod-like schemas, grants, verification, audit, service principals.
resources:
  jobs:
    capability_guides_access:
      name: capability-guides-access
      description: Grants through a group, segregates dev and prod access, verifies grants, audits changes, and lists service principals.
      tags:
        capability_guide_job: capability_guides_access
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: reader_group
          default: ${var.reader_group}
        - name: app_service_principal
          default: ${var.app_service_principal}
        - name: dev_schema
          default: ${resources.schemas.capability_guides_access_dev.name}
        - name: prod_schema
          default: ${resources.schemas.capability_guides_access_prod.name}
      tasks:
        - task_key: ensure_group
          notebook_task:
            notebook_path: ../guides/access-management/01_ensure_group.py

        - task_key: create_data
          depends_on:
            - task_key: ensure_group
          notebook_task:
            notebook_path: ../guides/access-management/02_create_data.py

        - task_key: apply_grants
          depends_on:
            - task_key: create_data
          notebook_task:
            notebook_path: ../guides/access-management/03_apply_grants.py

        - task_key: verify_grants
          depends_on:
            - task_key: apply_grants
          notebook_task:
            notebook_path: ../guides/access-management/04_verify_grants.py

        - task_key: audit_grant_changes
          depends_on:
            - task_key: apply_grants
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../guides/access-management/05_audit_grant_changes.sql
              source: WORKSPACE
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: check_audit
          depends_on:
            - task_key: audit_grant_changes
          notebook_task:
            notebook_path: ../guides/access-management/06_check_audit.py

        - task_key: list_service_principals
          notebook_task:
            notebook_path: ../guides/access-management/07_list_service_principals.py
