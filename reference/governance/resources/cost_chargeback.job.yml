# Cost tracking and chargeback: spend by product, tag, user, and job; budget check; forecast; optimization queries.
resources:
  jobs:
    capability_guides_cost:
      name: capability-guides-cost
      description: Breaks down list-price spend from system tables, checks a 7-day budget, forecasts 30 days with ai_forecast, and flags optimization candidates.
      tags:
        capability_guide_job: capability_guides_cost
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: budget_threshold_usd
          default: "${var.budget_threshold_usd}"
      tasks:
        - task_key: build_views
          notebook_task:
            notebook_path: ../guides/cost-chargeback/01_build_views.py

        - task_key: spend_breakdown
          depends_on:
            - task_key: build_views
          notebook_task:
            notebook_path: ../guides/cost-chargeback/02_spend_breakdown.py

        - task_key: budget_check
          depends_on:
            - task_key: spend_breakdown
          notebook_task:
            notebook_path: ../guides/cost-chargeback/03_budget_check.py

        - task_key: forecast
          depends_on:
            - task_key: spend_breakdown
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../guides/cost-chargeback/04_forecast.sql
              source: WORKSPACE
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: check_forecast
          depends_on:
            - task_key: forecast
          notebook_task:
            notebook_path: ../guides/cost-chargeback/05_check_forecast.py

        - task_key: optimization
          depends_on:
            - task_key: spend_breakdown
          notebook_task:
            notebook_path: ../guides/cost-chargeback/06_optimization.py
