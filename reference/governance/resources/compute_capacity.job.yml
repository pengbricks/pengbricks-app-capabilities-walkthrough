# Compute and capacity: settings, concurrent load on a 2X-Small test warehouse, queueing from system tables.
resources:
  jobs:
    capability_guides_compute_capacity:
      name: capability-guides-compute-capacity
      description: Reads warehouse settings, loads a temporary 2X-Small test warehouse, reads the queueing from system tables, and deletes the test warehouse.
      tags:
        capability_guide_job: capability_guides_compute_capacity
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 5400
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: queries
          default: "40"
        - name: range_rows
          default: "200000000"
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: read_settings
          notebook_task:
            notebook_path: ../guides/compute-capacity-management/01_read_settings.py

        - task_key: create_load_warehouse
          depends_on:
            - task_key: read_settings
          notebook_task:
            notebook_path: ../guides/compute-capacity-management/02_create_load_warehouse.py

        - task_key: generate_load
          depends_on:
            - task_key: create_load_warehouse
          notebook_task:
            notebook_path: ../guides/compute-capacity-management/03_generate_load.py

        - task_key: analyze_load
          depends_on:
            - task_key: generate_load
          notebook_task:
            notebook_path: ../guides/compute-capacity-management/04_analyze_load.py

        - task_key: delete_load_warehouse
          depends_on:
            - task_key: create_load_warehouse
            - task_key: generate_load
            - task_key: analyze_load
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../guides/compute-capacity-management/05_delete_load_warehouse.py
