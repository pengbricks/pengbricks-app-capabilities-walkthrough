# Unity Catalog with an EDM program: tags as the contract, an ABAC policy, the scanner metadata feed, external lineage, certification.
resources:
  jobs:
    capability_guides_unity_catalog_edm:
      name: capability-guides-unity-catalog-edm
      description: Creates sample tables, applies governed tags, creates a tag-driven ABAC policy, builds the metadata feed an EDM tool reads, registers external lineage, and certifies the gold table.
      tags:
        capability_guide_job: capability_guides_unity_catalog_edm
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: scanner_principal
          default: edm-scanner
        - name: tag_mode
          default: governed
        - name: cleanup
          default: keep
      tasks:
        - task_key: create_sample_tables
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/01_create_sample_tables.py

        - task_key: apply_tags
          depends_on:
            - task_key: create_sample_tables
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/02_apply_tags.py

        - task_key: abac_policy
          depends_on:
            - task_key: apply_tags
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/03_abac_policy.py

        - task_key: metadata_feed
          depends_on:
            - task_key: abac_policy
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/04_metadata_feed.py

        - task_key: external_lineage
          depends_on:
            - task_key: metadata_feed
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/05_external_lineage.py

        - task_key: certify_gold
          depends_on:
            - task_key: external_lineage
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/06_certify_gold.py

        - task_key: cleanup
          depends_on:
            - task_key: certify_gold
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../guides/unity-catalog-edm/07_cleanup.py
