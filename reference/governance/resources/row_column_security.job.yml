# Row and column security: column masks, an attribute row filter, a dynamic row filter, identity tests, the policy inventory, and a masking pattern library.
resources:
  jobs:
    capability_guides_row_column_security:
      name: capability-guides-row-column-security
      description: Applies masks and row filters to spec-generated tables, tests them as different identities, and inventories the policies.
      tags:
        capability_guide_job: capability_guides_row_column_security
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: app_service_principal
          default: ${var.app_service_principal}
        - name: pii_reader_group
          default: rcs-pii-readers
        - name: salt_scope
          default: rcs-demo
        - name: salt_key
          default: hash-salt
        - name: abac_mode
          default: ${var.rcs_abac_mode}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/row-column-security/01_generate_data.py

        - task_key: create_policies
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/row-column-security/02_create_policies.py

        - task_key: test_policies
          depends_on:
            - task_key: create_policies
          notebook_task:
            notebook_path: ../guides/row-column-security/03_test_policies.py

        - task_key: policy_inventory
          depends_on:
            - task_key: test_policies
          notebook_task:
            notebook_path: ../guides/row-column-security/04_policy_inventory.py

        - task_key: masking_patterns
          depends_on:
            - task_key: policy_inventory
          notebook_task:
            notebook_path: ../guides/row-column-security/05_masking_patterns.py
