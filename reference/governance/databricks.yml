bundle:
  name: capability-guides-governance

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schemas
  warehouse_id:
    description: SQL warehouse for SQL tasks, alerts, and dashboards
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  notification_email:
    description: Address that receives the budget alert
  schema:
    description: Base schema name for this bundle's tables
    default: capability_guides
  access_schema_base:
    description: Base name of the two access demo schemas (<base>_dev, <base>_prod); dev mode adds the user prefix once
    default: capability_guides_access
  edm_tag_mode:
    description: Default tag_mode for the Unity Catalog and EDM job. governed creates account-level governed tags and ABAC policies; plain creates nothing at account level
    default: governed
  use_case:
    description: Use-case spec under use_cases/ that drives sample data, policies, and tags
    default: general
  release:
    description: Release identifier (CI sets the Git commit SHA) recorded in resource tags
    default: local
  reader_group:
    description: Group that receives the schema and table grants
    default: capability-guides-readers
  budget_threshold_usd:
    description: Alert when list-price spend over the last 7 days is above this amount
    default: 50

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
    variables:
      schema: dev_${workspace.current_user.short_name}_capability_guides
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
