# Business terms and synonyms: ask the same questions before and after the semantic layer exists.
resources:
  jobs:
    capability_guides_ontology:
      name: capability-guides-ontology
      description: Generates sample sales tables, asks a Genie space the same questions before and after adding comments, tags, a metric view, and synonyms, and records both answers.
      tags:
        capability_guide_job: capability_guides_ontology
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/ontology/01_generate_data.py

        - task_key: ask_before
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../guides/ontology/02_ask_before.py
            base_parameters:
              run_id: "{{job.run_id}}"

        - task_key: add_semantics
          depends_on:
            - task_key: ask_before
          notebook_task:
            notebook_path: ../guides/ontology/03_add_semantics.py

        - task_key: ask_after
          depends_on:
            - task_key: add_semantics
          notebook_task:
            notebook_path: ../guides/ontology/04_ask_after.py
            base_parameters:
              run_id: "{{job.run_id}}"

        - task_key: compare_answers
          depends_on:
            - task_key: ask_after
          notebook_task:
            notebook_path: ../guides/ontology/05_compare_answers.py
            base_parameters:
              run_id: "{{job.run_id}}"
