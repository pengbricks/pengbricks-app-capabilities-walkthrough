# Business terms and synonyms: ask the same questions before and after the semantic layer exists.
resources:
  jobs:
    capability_guides_ontology:
      name: capability-guides-ontology
      description: Generates sample sales tables, asks a Genie space the same questions before and after adding comments, tags, a metric view, and synonyms, and records both answers.
      tags:
        capability_guide_job: capability_guides_ontology
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: warehouse_id
          default: ${var.warehouse_id}
      environments:
        - environment_key: genie
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.70
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
      tasks:
        - task_key: generate_data
          environment_key: genie
          spark_python_task:
            python_file: ../src/setup_data.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --recreate

        - task_key: ask_before
          depends_on:
            - task_key: generate_data
          environment_key: genie
          spark_python_task:
            python_file: ../src/ask_questions.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --warehouse-id={{job.parameters.warehouse_id}}
              - --stage=baseline
              - --run-id={{job.run_id}}

        - task_key: add_semantics
          depends_on:
            - task_key: ask_before
          environment_key: genie
          spark_python_task:
            python_file: ../src/apply_semantics.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: ask_after
          depends_on:
            - task_key: add_semantics
          environment_key: genie
          spark_python_task:
            python_file: ../src/ask_questions.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --warehouse-id={{job.parameters.warehouse_id}}
              - --stage=enhanced
              - --run-id={{job.run_id}}

        - task_key: compare_answers
          depends_on:
            - task_key: ask_after
          environment_key: genie
          spark_python_task:
            python_file: ../src/summarize_comparison.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --run-id={{job.run_id}}
