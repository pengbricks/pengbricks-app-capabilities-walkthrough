# Assistant user experience: scripted user tasks against a Genie space through the Conversation API.
resources:
  jobs:
    capability_guides_genie_ux:
      name: capability-guides-genie-ux
      description: Creates a Genie space and runs a scripted user session (discovery, question, refinement, feedback), logging each task, outcome, issue, and training need.
      tags:
        capability_guide_job: capability_guides_genie_ux
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/user-experience/01_prepare_data.py

        - task_key: prepare_semantics
          depends_on:
            - task_key: prepare_data
          notebook_task:
            notebook_path: ../guides/user-experience/02_prepare_semantics.py

        - task_key: run_user_session
          depends_on:
            - task_key: prepare_semantics
          notebook_task:
            notebook_path: ../guides/user-experience/03_run_user_session.py
            base_parameters:
              run_id: "{{job.run_id}}"
