# Assistant user experience: scripted user tasks against a Genie space through the Conversation API.
resources:
  jobs:
    capability_guides_genie_ux:
      name: capability-guides-genie-ux
      description: Creates a Genie space and runs a scripted user session (discovery, question, refinement, feedback), logging each task, outcome, issue, and training need.
      tags:
        capability_guide_job: capability_guides_genie_ux
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.capability_guides_genie.name}
        - name: use_case
          default: ${var.use_case}
        - name: warehouse_id
          default: ${var.warehouse_id}
      environments:
        - environment_key: genie
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.70
              - dbldatagen==0.4.0.post1
              - pyyaml>=6
      tasks:
        - task_key: prepare_data
          environment_key: genie
          spark_python_task:
            python_file: ../src/setup_data.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: prepare_semantics
          depends_on:
            - task_key: prepare_data
          environment_key: genie
          spark_python_task:
            python_file: ../src/apply_semantics.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml

        - task_key: run_user_session
          depends_on:
            - task_key: prepare_semantics
          environment_key: genie
          spark_python_task:
            python_file: ../src/run_ux_session.py
            parameters:
              - --catalog={{job.parameters.catalog}}
              - --schema={{job.parameters.schema}}
              - --use-case-file=${workspace.file_path}/use_cases/{{job.parameters.use_case}}.yml
              - --warehouse-id={{job.parameters.warehouse_id}}
              - --run-id={{job.run_id}}
