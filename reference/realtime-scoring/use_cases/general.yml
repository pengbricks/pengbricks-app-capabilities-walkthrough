# Use-case spec: the domain for the scoring guide. Code reads feature names, label, and
# request settings from here; nothing in src/ is specific to this domain.
name: general
seed: 20261014

model:
  name: account_risk_model
  alias: champion
  label: default_next_month
  # Data: UCI Default of Credit Card Clients (CC BY 4.0), 30,000 Taiwanese card holders, April to September 2005.
  # Yeh, I. (2009). Default of Credit Card Clients [Dataset]. UCI Machine Learning Repository. https://doi.org/10.24432/C55S3H
  # Features the endpoint accepts, each read from a `source` column of the file. `optional: true` means a
  # request may omit the feature; the model fills it with the training median. min and max are the 1st and
  # 99th percentiles, used to build test requests. Sex, education, marital status, and age are left out.
  features:
    - {name: credit_limit, source: LIMIT_BAL, type: double, min: 10000, max: 500000}
    - {name: repayment_status, source: PAY_0, type: double, min: -2, max: 3}     # months late in September; -2 and -1 mean paid on time
    - {name: bill_amount, source: BILL_AMT1, type: double, min: 0, max: 350000}
    - {name: last_payment, source: PAY_AMT1, type: double, min: 0, max: 66500, optional: true}
  training:
    dataset: credit_card_default          # a key of public_data.SOURCES
    label_source: default payment next month

endpoint:
  workload_size: Small
  scale_to_zero: true
  # Route optimization needs a JWT OAuth token. The serverless job token is opaque, so the
  # reference run keeps this off; set true when the scoring identity can mint a JWT (user or service principal OAuth).
  route_optimized: false
  ready_timeout_seconds: 1500

scoring:
  warm_requests: 50
  concurrent_requests: 20
  concurrency: 5
  request_timeout_seconds: 120
  # Row count per request body.
  records_per_request: 1
