bundle:
  name: capability-guides-realtime-scoring

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the guide schema and the registered model
  app_service_principal:
    description: Application ID of the Databricks App service principal that triggers quick runs
  schema:
    description: Schema for this bundle's tables and registered model
    default: capability_guides_realtime_scoring
  use_case:
    description: Use-case spec under use_cases/ that drives the training data and request shapes
    default: general
  release:
    description: Release identifier (CI sets the Git commit SHA) recorded in resource tags
    default: local

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_RUN
    service_principal_name: ${var.app_service_principal}

targets:
  dev:
    default: true
    mode: development
    presets:
      tags:
        release: ${var.release}
  test:
    presets:
      name_prefix: "[test] "
      tags:
        environment: test
        release: ${var.release}
