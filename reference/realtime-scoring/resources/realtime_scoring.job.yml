# Online model scoring: train and register a model, deploy a small scale-to-zero endpoint,
# score it with OAuth, and record latency and failure behavior.
resources:
  jobs:
    capability_guides_realtime_scoring:
      name: capability-guides-realtime-scoring
      description: Trains a UC model, deploys a Model Serving endpoint, measures scoring latency, and records failure behavior.
      tags:
        capability_guide_job: capability_guides_realtime_scoring
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: source_volume
          default: ${resources.volumes.scoring_source_files.name}
        - name: endpoint_name
          default: capability-guides-realtime-scoring
      tasks:
        - task_key: train_register
          notebook_task:
            notebook_path: ../guides/real-time-scoring/01_train_register.py

        - task_key: deploy_endpoint
          depends_on:
            - task_key: train_register
          notebook_task:
            notebook_path: ../guides/real-time-scoring/02_deploy_endpoint.py

        - task_key: score_and_measure
          depends_on:
            - task_key: deploy_endpoint
          notebook_task:
            notebook_path: ../guides/real-time-scoring/03_score_and_measure.py
            base_parameters:
              run_id: "{{job.run_id}}"
