# Cleanup: deletes the serving endpoint the scoring job creates.
resources:
  jobs:
    capability_guides_realtime_scoring_teardown:
      name: capability-guides-realtime-scoring-teardown
      description: Deletes the Model Serving endpoint created by the online scoring job.
      tags:
        capability_guide_job: capability_guides_realtime_scoring_teardown
        capability_guide_use_case: ${var.use_case}
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_case
          default: ${var.use_case}
        - name: endpoint_name
          default: capability-guides-realtime-scoring
      tasks:
        - task_key: delete_endpoint
          notebook_task:
            notebook_path: ../guides/real-time-scoring/04_teardown_endpoint.py
