feed:
  id: provider_b_events
  provider: provider_b
  mode: incremental_files
  format: json
  landing_path: ${var.landing_root}/provider-b/{snapshot_date}
  primary_keys: [event_id, event_time]
  watermark_column: source_updated_at
  schema_version: '1'
  mappings:
    source_event_id: event_id
    source_label: record_name
    source_region: region_code
  quality_rules:
    - name: event_id_required
      expression: event_id IS NOT NULL
      action: quarantine
    - name: source_timestamp_required
      expression: source_updated_at IS NOT NULL
      action: quarantine
  owner: data_platform_team
  target:
    bronze: bronze_provider_b
    silver: silver_canonical_records
